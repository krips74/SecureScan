<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScan — Register</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="auth-page">
  <div class="auth-card auth-card-enter">
    <div class="auth-logo">
      <a class="auth-brand" href="/home">
        <div class="logo-icon"><img src="assets/images/logo.svg" alt="SecureScan"></div>
        <h1>SecureScan</h1>
      </a>
    </div>
    <div class="success-msg" id="okMsg"></div>
    <div class="error-msg" id="errMsg"></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Choose a username">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 8 characters">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="password2" placeholder="Repeat password">
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="regBtn" onclick="doRegister()">
      Create Account
    </button>

    <div class="auth-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('ss_token')) window.location.href = '/dashboard';

  async function doRegister() {
    const btn = document.getElementById('regBtn');
    const username = document.getElementById('username').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const pass2    = document.getElementById('password2').value;

    if (!username || !email || !password) { showErr('All fields are required'); return; }
    if (password !== pass2)               { showErr('Passwords do not match'); return; }
    if (password.length < 8)              { showErr('Password must be at least 8 characters'); return; }

    btn.classList.add('loading'); btn.disabled = true;
    hideMsgs();

    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();

      if (data.success) {
        showOk(data.message || 'Account created. Check your email to verify, then sign in.');
        setTimeout(() => {
          window.location.href = '/login?check_email=1';
        }, 800);
      } else {
        showErr(data.error || 'Registration failed');
      }
    } catch(e) {
      showErr('Could not connect to server');
    } finally {
      btn.classList.remove('loading'); btn.disabled = false;
    }
  }

  function showErr(msg) {
    const el = document.getElementById('errMsg');
    el.textContent = msg; el.style.display = 'block';
  }

  function showOk(msg) {
    const el = document.getElementById('okMsg');
    el.textContent = msg; el.style.display = 'block';
  }

  function hideMsgs() {
    const err = document.getElementById('errMsg');
    const ok = document.getElementById('okMsg');
    if (err) err.style.display = 'none';
    if (ok) ok.style.display = 'none';
  }
</script>
</body>
</html>
