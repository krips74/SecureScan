<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScan — Forgot Password</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="auth-page">
  <div class="auth-card auth-card-enter">
    <div class="auth-logo">
      <a class="auth-brand" href="/home">
        <div class="logo-icon"><img src="assets/images/logo.svg" alt="SecureScan"></div>
        <h1>SecureScan</h1>
        <p>Reset your password</p>
      </a>
    </div>

    <div class="error-msg" id="errMsg"></div>

    <h2>Enter your email</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="sendOtpBtn" onclick="requestOtp()">
      Send OTP
    </button>

    <div class="auth-link">
      Back to <a href="/login">Sign in</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('ss_token')) window.location.href = '/dashboard';

  function showErr(msg) {
    const err = document.getElementById('errMsg');
    err.textContent = msg;
    err.style.display = 'block';
  }

  function clearErr() {
    const err = document.getElementById('errMsg');
    err.textContent = '';
    err.style.display = 'none';
  }

  async function requestOtp() {
    clearErr();
    const btn = document.getElementById('sendOtpBtn');
    const email = document.getElementById('email').value.trim();

    if (!email) { showErr('Please enter your email'); return; }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/password-reset/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        showErr(data.error || 'Could not send OTP');
        return;
      }

      sessionStorage.setItem('ss_reset_email', email);
      sessionStorage.removeItem('ss_reset_token');
      window.location.href = '/otp_verification';
    } catch (e) {
      showErr('Could not connect to server');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') requestOtp();
  });
</script>
</body>
</html>
