<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScan — Scan</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
</head>
<body data-page="scan">
<div class="app-layout">
  <aside class="sidebar"></aside>

  <main class="content">
    <div class="page-header">
      <h1>Scans</h1>
    </div>

    <div class="card">
      <div class="card-title">Quick Scan</div>
      <form id="quickAllForm" class="form-lg">
        <div class="form-group">
          <label>Target URL</label>
          <div class="input-row">
            <input type="url" id="quickAllUrl" placeholder="https://example.com" required>
            <button type="submit" class="btn btn-primary" id="quickAllBtn">Start Quick Scan</button>
          </div>
        </div>
      </form>

      <div id="quickAllLoading" style="display:none;">
        <div class="scan-status-row"><span id="quickAllLoadingText">Running quick scan…</span><span id="quickAllLoadingPct">0%</span></div>
        <div class="progress-bar-wrap"><div class="progress-bar" id="quickAllProgress"></div></div>
      </div>

      <div id="quickAllError" style="display:none;"></div>
      <div id="quickAllResults" style="display:none;"></div>
    </div>

    <div class="card">
      <div class="card-title">Reports</div>
      <div style="margin-top:12px;">
        <a class="btn btn-secondary" href="/reports">Open Reports</a>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/common.js"></script>
<script>
  const byId = (id) => document.getElementById(id);

  function isValidUrl(u) {
    try {
      const url = new URL(u);
      return url.protocol === 'http:' || url.protocol === 'https:';
    } catch { return false; }
  }

  function toolLabel(kind) {
    const k = (kind || '').toString().toLowerCase();
    if (k === 'xss') return 'XSS';
    if (k === 'sqli') return 'SQL Injection';
    if (k === 'open_redirect') return 'Open Redirect';
    if (k === 'cors') return 'CORS';
    if (k === 'headers') return 'Headers';
    if (k === 'phishing') return 'Phishing';
    return kind ? kind.toString() : '—';
  }

  (function initQuickAllScan() {
    const form = byId('quickAllForm');
    const urlInput = byId('quickAllUrl');
    const btn = byId('quickAllBtn');
    const loadingWrap = byId('quickAllLoading');
    const loadingTextEl = byId('quickAllLoadingText');
    const pctEl = byId('quickAllLoadingPct');
    const bar = byId('quickAllProgress');
    const errorWrap = byId('quickAllError');
    const resultsWrap = byId('quickAllResults');

    if (!form || !urlInput || !btn || !loadingWrap || !loadingTextEl || !pctEl || !bar || !errorWrap || !resultsWrap) return;

    let timer = null;
    function showQuickLoading(msg) {
      loadingTextEl.textContent = msg || 'Running quick scan…';
      loadingWrap.style.display = 'block';
      let pct = 0;
      bar.style.width = '0%';
      pctEl.textContent = '0%';
      clearInterval(timer);
      timer = setInterval(() => {
        pct = Math.min(95, pct + Math.max(1, Math.round(Math.random() * 7)));
        bar.style.width = pct + '%';
        pctEl.textContent = pct + '%';
      }, 320);
    }
    function hideQuickLoading() {
      clearInterval(timer);
      timer = null;
      loadingWrap.style.display = 'none';
      bar.style.width = '0%';
      pctEl.textContent = '0%';
    }

    function showQuickError(msg) {
      errorWrap.style.display = 'block';
      const item = el('div', { className: 'result-item vuln-high' });
      item.appendChild(el('div', { className: 'result-title', text: 'Quick scan failed' }));
      item.appendChild(el('div', { className: 'result-detail', text: msg || 'Unknown error' }));
      errorWrap.replaceChildren(item);
    }

    function showQuickResults(data) {
      resultsWrap.style.display = 'block';
      const total = Number(data.total_vulnerabilities || 0);
      const scanId = data.scan_id;
      const types = Array.isArray(data.scan_types) ? data.scan_types : [];
      const scans = (data.scans && typeof data.scans === 'object') ? data.scans : {};

      const summary = el('div', { className: `result-item ${total > 0 ? 'vuln-high' : 'vuln-safe'}` });
      summary.appendChild(el('div', { className: 'result-title', text: 'Summary' }));
      summary.appendChild(el('div', { className: 'result-detail', text: `Target: ${data.target || '—'}` }));
      summary.appendChild(el('div', { className: 'result-detail', text: `Scan types: ${types.map(toolLabel).join(', ') || '—'}` }));
      summary.appendChild(el('div', { className: 'result-detail', text: `Total vulnerabilities: ${total}` }));
      if (scanId) summary.appendChild(el('div', { className: 'result-detail', text: `Saved to Reports (Scan ID: ${scanId})` }));
      if (data.timestamp) {
        const ts = el('div', { className: 'result-detail', text: `Timestamp: ${data.timestamp}` });
        ts.style.color = 'var(--text-muted)';
        summary.appendChild(ts);
      }

      const listWrap = el('div', { className: 'results-section' });
      for (const t of types) {
        const r = scans[t] || {};
        const found = Number(r.total_found || 0);
        const item = el('div', { className: `result-item ${found > 0 ? 'vuln-medium' : 'vuln-safe'}` });
        item.appendChild(el('div', { className: 'result-title', text: toolLabel(t) }));
        item.appendChild(el('div', { className: 'result-detail', text: `Findings: ${Number.isFinite(found) ? found : 0}` }));
        if (typeof r.grade !== 'undefined') item.appendChild(el('div', { className: 'result-detail', text: `Grade: ${String(r.grade)}` }));
        if (Array.isArray(r.issues) && r.issues.length) item.appendChild(el('div', { className: 'result-detail', text: `Issues: ${r.issues.length}` }));
        listWrap.appendChild(item);
      }

      const actions = el('div');
      actions.style.marginTop = '12px';
      actions.style.display = 'flex';
      actions.style.gap = '10px';
      actions.style.flexWrap = 'wrap';

      resultsWrap.replaceChildren(summary, listWrap, actions);
      resultsWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorWrap.style.display = 'none';
      errorWrap.replaceChildren();
      resultsWrap.style.display = 'none';
      resultsWrap.replaceChildren();

      const url = (urlInput.value || '').trim();
      if (!url || !isValidUrl(url)) {
        showQuickError('Please enter a valid URL starting with http:// or https://');
        return;
      }

      showQuickLoading('Running quick scan…');
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const body = {
          url,
          scan_types: ['xss', 'sqli', 'open_redirect', 'cors', 'headers', 'phishing'],
          method: 'GET',
          options: {
            timeout: 10,
            safe_mode: true,
          }
        };

        const res = await fetch('/api/scan/unified', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (!res.ok || !data || data.success !== true) throw new Error((data && data.error) ? data.error : 'Quick scan failed');

        clearInterval(timer);
        bar.style.width = '100%';
        pctEl.textContent = '100%';
        showQuickResults(data);
        showToast('Quick scan completed. Report updated.', 'success');
      } catch (err) {
        showQuickError((err && err.message) ? err.message : 'Could not connect to server');
      } finally {
        hideQuickLoading();
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });
  })();
</script>
</body>
</html>
