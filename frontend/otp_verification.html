<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScan — OTP Verification</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="auth-page">
  <div class="auth-card auth-card-enter">
    <div class="auth-logo">
      <a class="auth-brand" href="/home">
        <div class="logo-icon"><img src="assets/images/logo.svg" alt="SecureScan"></div>
        <h1>SecureScan</h1>
        <p>Verify OTP</p>
      </a>
    </div>

    <div class="error-msg" id="errMsg"></div>

    <h2>Enter OTP</h2>
    <div class="form-group">
      <label>OTP</label>
      <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code">
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="verifyOtpBtn" onclick="verifyOtp()">
      Verify OTP
    </button>

    <div class="auth-link" style="text-align:left;">
      Didn’t get it? <a href="#" onclick="resendOtp(event)">Resend OTP</a>
    </div>

    <div class="auth-link">
      Back to <a href="/login">Sign in</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('ss_token')) window.location.href = '/dashboard';

  const resetEmail = (sessionStorage.getItem('ss_reset_email') || '').trim();
  if (!resetEmail) {
    window.location.href = '/forgot_password';
  }

  function showErr(msg) {
    const err = document.getElementById('errMsg');
    err.textContent = msg;
    err.style.display = 'block';
  }

  function clearErr() {
    const err = document.getElementById('errMsg');
    err.textContent = '';
    err.style.display = 'none';
  }

  async function resendOtp(e) {
    e.preventDefault();
    clearErr();

    try {
      const res = await fetch('/api/auth/password-reset/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: resetEmail })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) {
        showErr(data.error || 'Could not resend OTP');
        return;
      }
      showErr('OTP resent. Check your email.');
    } catch (_) {
      showErr('Could not connect to server');
    }
  }

  async function verifyOtp() {
    clearErr();
    const btn = document.getElementById('verifyOtpBtn');
    const otp = document.getElementById('otp').value.trim();

    if (!/^\d{6}$/.test(otp)) {
      showErr('OTP must be 6 digits');
      return;
    }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/password-reset/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: resetEmail, otp })
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok || data.success === false) {
        showErr(data.error || 'Invalid OTP');
        return;
      }

      sessionStorage.setItem('ss_reset_token', data.reset_token);
      window.location.href = '/reset_password';
    } catch (_) {
      showErr('Could not connect to server');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const otp = document.getElementById('otp');
    if (otp) otp.focus();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') verifyOtp();
  });
</script>
</body>
</html>
