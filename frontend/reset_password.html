<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureScan — Reset Password</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="auth-page">
  <div class="auth-card auth-card-enter">
    <div class="auth-logo">
      <a class="auth-brand" href="/home">
        <div class="logo-icon"><img src="assets/images/logo.svg" alt="SecureScan"></div>
        <h1>SecureScan</h1>
        <p>Create a new password</p>
      </a>
    </div>

    <div class="error-msg" id="errMsg"></div>

    <h2>New password</h2>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Min 8 characters" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="newPassword2" placeholder="Repeat new password" autocomplete="new-password">
    </div>

    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;" id="resetBtn" onclick="confirmReset()">
      Update Password
    </button>

    <div class="auth-link">
      Back to <a href="/login">Sign in</a>
    </div>
  </div>
</div>

<script>
  if (localStorage.getItem('ss_token')) window.location.href = '/dashboard';

  const resetEmail = (sessionStorage.getItem('ss_reset_email') || '').trim();
  const resetToken = (sessionStorage.getItem('ss_reset_token') || '').trim();

  if (!resetEmail) {
    window.location.href = '/forgot_password';
  }
  if (!resetToken) {
    window.location.href = '/otp_verification';
  }

  function showErr(msg) {
    const err = document.getElementById('errMsg');
    err.textContent = msg;
    err.style.display = 'block';
  }

  function clearErr() {
    const err = document.getElementById('errMsg');
    err.textContent = '';
    err.style.display = 'none';
  }

  async function confirmReset() {
    clearErr();
    const btn = document.getElementById('resetBtn');
    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('newPassword2').value;

    if (!p1 || p1.length < 8) { showErr('Password must be at least 8 characters'); return; }
    if (p1 !== p2) { showErr('Passwords do not match'); return; }

    btn.classList.add('loading');
    btn.disabled = true;

    try {
      const res = await fetch('/api/auth/password-reset/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: resetEmail, reset_token: resetToken, new_password: p1 })
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok || data.success === false) {
        showErr(data.error || 'Could not update password');
        return;
      }

      sessionStorage.removeItem('ss_reset_token');
      alert('Password updated. Please sign in.');
      window.location.href = '/login';
    } catch (_) {
      showErr('Could not connect to server');
    } finally {
      btn.classList.remove('loading');
      btn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const p = document.getElementById('newPassword');
    if (p) p.focus();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmReset();
  });
</script>
</body>
</html>
